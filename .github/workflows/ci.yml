name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify default suite
        run: mvn -B verify
      - name: Build image
        run: docker build --tag stagebet:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: stagebet:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
