spring:
  application:
    name: StageBet
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:stagebet}
    username: ${POSTGRES_USER:stagebet}
    password: ${POSTGRES_PASSWORD:stagebet}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
stagebet:
  payments:
    stripe:
      enabled: ${STRIPE_SANDBOX_ENABLED:false}
      base-url: ${STRIPE_SANDBOX_BASE_URL:https://api.stripe.com}
      secret-key: ${STRIPE_SANDBOX_SECRET_KEY:}
      webhook-secret: ${STRIPE_SANDBOX_WEBHOOK_SECRET:local-webhook-secret}
      signature-tolerance-seconds: ${STRIPE_WEBHOOK_TOLERANCE_SECONDS:300}
  rate-limit:
    max-requests: ${WAGER_RATE_LIMIT_MAX_REQUESTS:20}
    window: ${WAGER_RATE_LIMIT_WINDOW:PT1S}
  messaging:
    topic: ${WAGER_EVENTS_TOPIC:wager.events.v1}
    dead-letter-topic: ${WAGER_EVENTS_DLQ_TOPIC:wager.events.dlq.v1}
    publisher-delay-ms: ${WAGER_EVENTS_PUBLISHER_DELAY_MS:1000}
