<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StageBet Stripe Sandbox checkout</title>
<script src="https://js.stripe.com/v3/"></script><style>body{font:16px sans-serif;max-width:42rem;margin:3rem auto}input,button{display:block;margin:.75rem 0;padding:.5rem;width:100%;box-sizing:border-box}#card{border:1px solid #777;padding:.8rem}#result{white-space:pre-wrap}</style></head>
<body><h1>Sandbox checkout</h1><p>Demo only. Card details are collected by Stripe Elements and never sent to StageBet.</p>
<input id="token" placeholder="Keycloak access token"><input id="tenant" placeholder="Tenant UUID"><input id="player" placeholder="Player UUID"><input id="amount" value="12.50"><input id="currency" value="USD"><button id="start">Create checkout</button><div id="card"></div><button id="confirm" disabled>Confirm test card</button><pre id="result"></pre>
<script>
let stripe, card, checkout; const result=document.querySelector('#result'); const value=id=>document.querySelector('#'+id).value;
const headers=key=>({'Content-Type':'application/json','Authorization':'Bearer '+value('token'),'X-Idempotency-Key':key});
document.querySelector('#start').onclick=async()=>{const key=crypto.randomUUID(), base=`/api/tenants/${value('tenant')}/players/${value('player')}/sandbox-checkout`; const response=await fetch(base,{method:'POST',headers:headers(key),body:JSON.stringify({amount:value('amount'),currency:value('currency')})}); checkout=await response.json(); if(!response.ok){result.textContent=JSON.stringify(checkout,null,2);return} stripe=Stripe(checkout.publishableKey); card=stripe.elements().create('card');card.mount('#card');document.querySelector('#confirm').disabled=false;result.textContent='PaymentIntent created: '+checkout.providerPaymentIntentId};
document.querySelector('#confirm').onclick=async()=>{const method=await stripe.createPaymentMethod({type:'card',card});if(method.error){result.textContent=method.error.message;return}const base=`/api/tenants/${value('tenant')}/players/${value('player')}/sandbox-checkout/${checkout.paymentId}/confirm`;const response=await fetch(base,{method:'POST',headers:headers(crypto.randomUUID()),body:JSON.stringify({paymentMethodId:method.paymentMethod.id})});const body=await response.json();if(body.clientSecret&&body.status==='requires_action'){const action=await stripe.handleNextAction({clientSecret:body.clientSecret});result.textContent=JSON.stringify(action,null,2);return}result.textContent=JSON.stringify(body,null,2)};
</script></body></html>
